<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giam Sat Muc Nuoc</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f7f6; color: #333; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #0066cc; }
        .card { background: #fff; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: center; }
        .box { background: #e9ecef; padding: 15px; border-radius: 6px; }
        .value { font-size: 24px; font-weight: bold; color: #0056b3; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; color: #fff; font-weight: bold; cursor: pointer; width: 100%; margin-top: 5px; }
        .btn-on { background: #28a745; }
        .btn-off { background: #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hệ Thống Giám Sát Mực Nước Bể Nuôi</h1>
        
        <div class="card">
            <h3>Thông Số Thời Gian Thực</h3>
            <div class="grid">
                <div class="box">
                    <p>Mực Nước</p>
                    <div class="value"><span id="water">50</span> cm</div>
                </div>
                <div class="box">
                    <p>Nhiệt Độ</p>
                    <div class="value"><span id="temp">28</span> °C</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>Điều Khiển Thiết Bị (Thủ Công / Tự Động)</h3>
            <div class="grid">
                <div>
                    <p>Máy Bơm Vào: <b id="pump-txt" style="color:red">TẮT</b></p>
                    <button id="pump-btn" class="btn btn-off" onclick="togglePump()">Bật Máy Bơm</button>
                </div>
                <div>
                    <p>Van Xả Ra: <b id="drain-txt" style="color:red">ĐÓNG</b></p>
                    <button id="drain-btn" class="btn btn-off" onclick="toggleDrain()">Mở Van Xả</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>Biểu Đồ Mực Nước & Nhiệt Độ</h3>
            <canvas id="myChart" height="120"></canvas>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('myChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: 'Mực nước (cm)', data: [], borderColor: '#0066cc', tension: 0.3 },
                    { label: 'Nhiệt độ (°C)', data: [], borderColor: '#ff6384', tension: 0.3 }
                ]
            },
            options: { responsive: true, scales: { y: { min: 0, max: 100 } } }
        });

        let waterVal = 50;
        let tempVal = 28;
        let pumpOn = false;
        let drainOn = false;

        function togglePump() {
            pumpOn = !pumpOn;
            updateControlUI();
        }

        function toggleDrain() {
            drainOn = !drainOn;
            updateControlUI();
        }

        function updateControlUI() {
            document.getElementById('pump-txt').innerText = pumpOn ? "ĐANG BẬT" : "TẮT";
            document.getElementById('pump-txt').style.color = pumpOn ? "green" : "red";
            document.getElementById('pump-btn').innerText = pumpOn ? "Tắt Máy Bơm" : "Bật Máy Bơm";
            document.getElementById('pump-btn').className = pumpOn ? "btn btn-on" : "btn btn-off";

            document.getElementById('drain-txt').innerText = drainOn ? "ĐANG MỞ" : "ĐÓNG";
            document.getElementById('drain-txt').style.color = drainOn ? "green" : "red";
            document.getElementById('drain-btn').innerText = drainOn ? "Đóng Van Xả" : "Mở Van Xả";
            document.getElementById('drain-btn').className = drainOn ? "btn btn-on" : "btn btn-off";
        }

        setInterval(() => {
            // Thuật toán thay đổi mực nước thực tế
            if (pumpOn && !drainOn) {
                waterVal += 2;
                if (waterVal >= 80) pumpOn = false; // Đạt ngưỡng trên thì tự tắt bơm
            } else if (drainOn && !pumpOn) {
                waterVal -= 2;
                if (waterVal <= 50) drainOn = false; // Về ngưỡng an toàn thì đóng van
            } else {
                // Tự động hóa theo ngưỡng thực tế
                if (waterVal < 30) pumpOn = true;
                if (waterVal > 85) drainOn = true;
            }

            waterVal = Math.max(0, Math.min(100, waterVal + (Math.random() - 0.5)));
            tempVal = Math.max(20, Math.min(40, tempVal + (Math.random() - 0.5) * 0.5));

            document.getElementById('water').innerText = waterVal.toFixed(1);
            document.getElementById('temp').innerText = tempVal.toFixed(1);
            updateControlUI();

            const timeNow = new Date().toLocaleTimeString();
            chart.data.labels.push(timeNow);
            chart.data.datasets[0].data.push(waterVal);
            chart.data.datasets[1].data.push(tempVal);

            if (chart.data.labels.length > 8) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
                chart.data.datasets[1].data.shift();
            }
            chart.update();
        }, 2000);
    </script>
</body>
</html>
